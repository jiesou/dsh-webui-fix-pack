name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing / OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Typecheck, build and publish
        shell: bash
        run: |
          set -euo pipefail
          for dir in plugins/*/ bundles/*/; do
            [ -f "$dir/package.json" ] || continue
            (cd "$dir" && npm run typecheck --if-present && npm run build --if-present)
            (cd "$dir" && npm publish --provenance --access public)
          done